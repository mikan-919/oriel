name: Validate and deploy Cloudflare Apps

on:
  push:
    branches:
      - main
    paths:
      - "crates/oriel-relay/**"
      - "crates/oriel-web/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/ci.yml"
      - "scripts/deploy-worker.mjs"
      - "scripts/check-deploy-head.sh"
      - "scripts/test_deploy_order.py"
  pull_request:
    paths:
      - "crates/oriel-relay/**"
      - "crates/oriel-web/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/ci.yml"
      - "scripts/deploy-worker.mjs"
      - "scripts/check-deploy-head.sh"
      - "scripts/test_deploy_order.py"

permissions:
  contents: read

jobs:
  deploy:
    concurrency:
      group: production-cloudflare-apps
      cancel-in-progress: false
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates/oriel-relay

    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy

      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Install worker-build
        run: cargo install --locked worker-build --version "^0.8"

      - name: Install Node dependencies
        run: npm ci

      - name: Check Rust formatting
        working-directory: .
        run: cargo fmt --all -- --check

      - name: Clippy
        working-directory: .
        run: cargo clippy -p oriel-relay -p oriel-web --all-targets --locked -- -D warnings

      - name: Check Relay types
        run: npm run typecheck

      - name: Build Relay
        run: npm run build

      - name: Verify authentication boundaries
        run: npm test

      - name: Verify deployment ordering
        working-directory: .
        run: python3 -m unittest discover -s scripts -p test_deploy_order.py

      - name: Install Browser dependencies
        working-directory: crates/oriel-web
        run: npm ci

      - name: Check Browser types
        working-directory: crates/oriel-web
        run: npm run typecheck

      - name: Build Browser
        working-directory: crates/oriel-web
        run: npm run build

      - name: Verify Browser
        working-directory: crates/oriel-web
        run: npm test

      - name: Check main head before deployment
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: deploy-head
        working-directory: .
        env:
          DEPLOY_SHA: ${{ github.sha }}
        run: bash scripts/check-deploy-head.sh

      - name: Deploy Relay before its Browser client
        if: steps.deploy-head.outputs.deploy == 'true'
        run: npm run deploy:prebuilt
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Browser
        if: steps.deploy-head.outputs.deploy == 'true'
        working-directory: crates/oriel-web
        run: npm run deploy:prebuilt
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
