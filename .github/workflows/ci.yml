name: Deploy Cloudflare Apps

on:
  push:
    branches:
      - main
    paths:
      - "crates/oriel-relay/**"
      - "crates/oriel-web/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/ci.yml"
      - "scripts/deploy-worker.mjs"

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates/oriel-relay

    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Install worker-build
        run: cargo install --locked worker-build --version "^0.8"

      - name: Install Node dependencies
        run: npm ci

      - name: Build Relay
        run: npm run build

      - name: Verify authentication boundaries
        run: npm test

      - name: Deploy Relay before its Browser client
        run: npm run deploy:prebuilt
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Install Browser dependencies
        working-directory: crates/oriel-web
        run: npm ci

      - name: Build Browser
        working-directory: crates/oriel-web
        run: npm run build

      - name: Deploy Browser
        working-directory: crates/oriel-web
        run: npm run deploy:prebuilt
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
